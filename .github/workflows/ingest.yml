name: Sagar Drishti — Scheduled Live ERDDAP SST Ingestion & Retention Workflow

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Manual trigger option in GitHub Actions UI

jobs:
  ingest:
    name: Run ERDDAP SST Ingestion Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Standalone SST Ingestion & Retention Pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: sagar_drishti
          ERDDAP_BASE_URL: https://coastwatch.pfeg.noaa.gov/erddap
          ERDDAP_DATASET_ID: ncdcOisst21NrtAgg_LonPM180
          ERDDAP_TIMEOUT_SECONDS: 90
          REGION_MIN_LAT: -30.0
          REGION_MAX_LAT: 30.0
          REGION_MIN_LON: 30.0
          REGION_MAX_LON: 120.0
          EXPECTED_LATENCY_DAYS: 3
          STALE_THRESHOLD_DAYS: 3
          RETENTION_WINDOW_DAYS: 180
          MAX_BACKFILL_DAYS_PER_RUN: 7
          INGEST_LOCK_TTL_SECONDS: 1800
          MIN_HISTORY_DAYS: 30
        run: |
          python backend/run_ingest.py
